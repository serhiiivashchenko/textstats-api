name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore TextStats.Tests/TextStats.Tests.csproj

      - name: Build
        run: dotnet build TextStats.Tests/TextStats.Tests.csproj --no-restore

      - name: Run tests
        run: dotnet test TextStats.Tests/TextStats.Tests.csproj --no-build