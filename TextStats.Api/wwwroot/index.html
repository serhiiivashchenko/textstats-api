<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>TextStats</title>
</head>

<body>
    <h1>TextStats</h1>
    <h2>Improve your text</h2>
    <textarea id="textInput" rows="8" cols="60" maxlength="2000" placeholder="Enter text to improve...">
    </textarea>
    <br>
    <button id="improveButton">
        Improve text
    </button>
    <h2>Improved text</h2>
    <div id="result"></div>
    <script>
        const textInput = document.getElementById("textInput");
        const improveButton = document.getElementById("improveButton");
        const result = document.getElementById("result");

        improveButton.addEventListener("click", async () => {
            const text = textInput.value;

            improveButton.disabled = true;
            improveButton.textContent = "Improving...";
            result.textContent = "";

            try {
                const response = await fetch("/api/improve", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-Api-Key": "textstats-local-dev"
                    },
                    body: JSON.stringify({
                        text: text
                    })
                });

                if (!response.ok) {
                    throw new Error(`Request failed with status ${response.status}`);
                }
                const data = await response.json();
                result.textContent = data.improved;
            } catch (error) {
                result.textContent = "We are having technical issues. Try again later.";
            }
            finally {
                improveButton.disabled = false;
                improveButton.textContent = "Improve text";
            }
        });
    </script>
</body>

</html>
