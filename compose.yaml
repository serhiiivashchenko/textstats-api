services:
  api:
    build:
      context: ./TextStats.Api
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: E2E
      OpenAI__BaseAddress: http://wiremock:8080
      OpenAI__ApiKey: e2e-dummy-key
      E2E_BASE_URL: http://api:8080
    depends_on:
      wiremock:
        condition: service_healthy
  wiremock:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
